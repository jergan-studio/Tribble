<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play — Tribble</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.player{width:min(900px,100%);background:#181b28;border:1px solid #2b3043;border-radius:16px;padding:22px}.player-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.player h1{font:700 24px system-ui;margin:0}.player canvas{display:block;width:100%;aspect-ratio:8/5;background:#20283a;border:1px solid #343b52;border-radius:8px}.player small{color:#9299b1}.player-error{color:#ff9eac}</style></head><body><main class="player"><div class="player-head"><div><h1 id="title">Loading game…</h1><small>Made with Tribble · Jergan Studio</small></div><a class="btn btn-quiet" href="/">Create your own</a></div><canvas id="stage" width="640" height="400"></canvas><p id="status"><small>Loading shared game…</small></p></main><script>
(async()=>{
 const id=new URLSearchParams(location.search).get("id"),status=document.getElementById("status"),canvas=document.getElementById("stage"),ctx=canvas.getContext("2d");
 let game=null,running=false;
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const ordered=()=>[...(game?.blocks||[])].sort((a,b)=>(a.y??0)-(b.y??0)||(a.x??0)-(b.x??0));
 const draw=()=>{
  ctx.clearRect(0,0,640,400);ctx.fillStyle="#20283a";ctx.fillRect(0,0,640,400);ctx.strokeStyle="#ffffff0a";
  for(let x=0;x<=640;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke()}
  for(let y=0;y<=400;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke()}
  (game?.sprites||[]).forEach(s=>{if(s.hidden)return;if(s.image){let img=new Image();img.src=s.image;if(img.complete&&img.naturalWidth)ctx.drawImage(img,s.x-s.size/2,s.y-s.size/2,s.size,s.size);else img.onload=draw}else{ctx.fillStyle=s.color||"#8b7cff";ctx.beginPath();ctx.arc(s.x,s.y,s.size/2,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#fff";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText(s.name||"Sprite",s.x,s.y+s.size/2+17)});
 };
 const run=async(blocks,depth=0)=>{if(depth>8)return;for(let i=0;i<blocks.length;i++){const b=blocks[i],s=(game.sprites||[]).find(x=>x.id===b.spriteId)||game.sprites[0],n=Number(b.value)||0;if(["event_when_run","event_when_key","key_pressed"].includes(b.type))continue;
  if(b.type==="move_sprite"&&s){const a=(s.rotation||0)*Math.PI/180;s.x=Math.max(0,Math.min(640,s.x+Math.cos(a)*n));s.y=Math.max(0,Math.min(400,s.y+Math.sin(a)*n))}
  else if(b.type==="set_position"&&s){s.x=Number(b.value)||0;s.y=Number(b.value2)||0}
  else if(b.type==="change_x"&&s)s.x+=n;else if(b.type==="change_y"&&s)s.y+=n;
  else if(b.type==="go_to_position"&&s){s.x=Number(b.value)||0;s.y=Number(b.value2)||0}
  else if(b.type==="turn_sprite"&&s)s.rotation=(s.rotation||0)+n;
  else if(b.type==="say_text")status.textContent=String(b.value??"");
  else if(b.type==="change_color"&&s)s.color="#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0");
  else if(b.type==="show_sprite"&&s)s.hidden=false;else if(b.type==="hide_sprite"&&s)s.hidden=true;
  else if(b.type==="controls_wait")await wait(Math.max(0,Math.min(10,n))*1000);
  else if(b.type==="repeat"){const next=blocks[i+1],count=Math.max(0,Math.min(100,Math.floor(n)));if(next){for(let k=0;k<count;k++)await run([next],depth+1);i++}}
  draw();await wait(16);
 }};
 const runAll=async(blocks)=>{if(running)return;running=true;try{await run(blocks)}finally{running=false;draw()}};
 try{
  if(!id)throw Error("Missing share id.");const r=await fetch("/api/share?id="+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw Error(d.error||"Could not load game.");
  game=d;document.getElementById("title").textContent=d.title||"Untitled game";draw();
  const blocks=ordered(),start=blocks.findIndex(b=>b.type==="event_when_run");await runAll(start>=0?blocks.slice(start+1):blocks);
  status.innerHTML="<small>Game ready · Use the keyboard controls programmed by the creator.</small>";
  document.addEventListener("keydown",async e=>{if(running)return;const key=e.code==="Space"?"SPACE":e.code.toUpperCase().replace("KEY","");const list=ordered(),hats=list.filter(b=>b.type==="event_when_key"&&b.key===key);if(hats.length){e.preventDefault();for(const hat of hats){const at=list.indexOf(hat);await runAll(list.slice(at+1))}}});
 }catch(e){status.className="player-error";status.textContent=e.message}
})();
</script></body></html>
