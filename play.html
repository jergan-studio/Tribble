<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play — Tribble</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.player{width:min(900px,100%);background:#181b28;border:1px solid #2b3043;border-radius:16px;padding:22px}.player-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.player h1{font:700 24px system-ui;margin:0}.player canvas{display:block;width:100%;aspect-ratio:8/5;background:#20283a;border:1px solid #343b52;border-radius:8px}.player small{color:#9299b1}.player-error{color:#ff9eac}</style></head><body><main class="player"><div class="player-head"><div><h1 id="title">Loading game…</h1><small>Made with Tribble · Jergan Studio</small></div><a class="btn btn-quiet" href="/">Create your own</a></div><canvas id="stage" width="640" height="400"></canvas><p id="status"><small>Loading shared game…</small></p></main><script>
(async()=>{const id=new URLSearchParams(location.search).get("id"),status=document.getElementById("status"),canvas=document.getElementById("stage"),ctx=canvas.getContext("2d");try{if(!id)throw Error("Missing share id.");const r=await fetch("/api/share?id="+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||"Could not load game.");document.getElementById("title").textContent=d.title||"Untitled game";ctx.fillStyle="#20283a";ctx.fillRect(0,0,640,400);ctx.strokeStyle="#ffffff0a";for(let x=0;x<=640;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke()}for(let y=0;y<=400;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke()}for(const s of d.sprites||[]){if(s.image){const img=new Image();img.onload=()=>ctx.drawImage(img,s.x-s.size/2,s.y-s.size/2,s.size,s.size);img.src=s.image}else{ctx.fillStyle=s.color||"#8b7cff";ctx.beginPath();ctx.arc(s.x,s.y,s.size/2,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#fff";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText(s.name||"Sprite",s.x,s.y+s.size/2+17)}status.innerHTML="<small>Shared game preview</small>"}catch(e){status.className="player-error";status.textContent=e.message}})();
</script></body></html>
